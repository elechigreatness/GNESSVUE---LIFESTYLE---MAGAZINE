<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNESSVUE</title>
    <link rel="stylesheet" href="./css/materialize.css">
    
</head>
<body>
    <header>
        <nav class="white">
            <div class="container">
                <a href="#" class="brand-logo red-text">GNESSVUE</a>
                    <ul class="right"><a href="#cooking" class="red-text">COOKING</a></ul>
                    <ul class="right"><a href="#tech" class="red-text">TECH</a></ul>
                    <ul class="right"><a href="#travel" class="red-text">TRAVEL</a></ul>
                    <ul class="right"><a href="#fitness" class="red-text">FITNESS</a></ul>
            </div>
        </nav>
    </header>

    <main>
        <!-- cooking section -->
        <section id="cooking">
            <div class="parallax-container hide-on-small-and-down">
                <div class="parallax">
                    <img src="./IMG/COLLAPSIBLE IMG1.jpg" alt="collapsibleimg" width="100%" class="responsive-img">
                </div>
            </div>
            <!-- image to be displayed on mobile screen instead of parralax -->
            <div >
                <img src="./IMG/COLLAPSIBLE IMG1.jpg" alt="collapsibleimg" width="100%" class="responsive-img hide-on-med-and-up" >
            </div>
            <div class="container">
                <h1 class="red-text">COOKING</h1>
                <div class="row">
                    <div class="col s12 m6 l4">
                        <div class="card">
                            <div class="card-image">
                                <img src="./IMG/FRIED RICE.jpg" alt="FRIED" class="responsive-img">
                            </div>
                            <div class="card-content">
                                <h4 class="red-text">Fried Rice</h4>
                                <p>That momment when you're craving that perfect, spicy fried rice. Golden, flufy, and packed with flavor-pure GNESSVUE EATS satisfaction.</p>
                            </div>
                            <div class="card-action">
                                <a href="" target="_blank" class="btn-flat red white-text">Watch Now <i class="material-icons">arrow_forward</i></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
<script src="../js/jquery.js"></script>
<script src="../js/materialize.js"></script>
<script>
    $(document).ready( ()=>{
        $(".sidenav").sidenav();
        $(".collapsible").collapsible();
        $(".parallax").parallax();
    })
</script>
</html>
